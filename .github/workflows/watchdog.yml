# Uptime watchdog. Every 10 minutes it hits /api/health (which touches the
# DB — also counts as keepalive). The workflow FAILS when the portal is
# unhealthy, so GitHub emails the repo owner — that's the alert channel even
# without extra monitoring.
#
# It no longer tries to restore a paused Supabase project: the project is on
# Supabase Pro, which does not pause, so that step and its management token
# are gone.
#
# Repo secrets required:
#   PORTAL_URL             e.g. https://wholesale.drevifashion.com
name: watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          set -e
          code=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 30 "${{ secrets.PORTAL_URL }}/api/health" || echo 000)
          echo "health: HTTP $code $(cat /tmp/h.json 2>/dev/null)"
          [ "$code" = "200" ] && exit 0

          echo "Portal unhealthy — failing so GitHub emails an alert."
          exit 1
