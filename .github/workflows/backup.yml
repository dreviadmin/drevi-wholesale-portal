# Hourly off-site backup: pulls the full-database export from the portal and
# stores it as a GitHub artifact (90-day retention). The repo's artifacts can
# be downloaded by anyone who can see the repo, so the export is ALWAYS
# encrypted before upload; there is no unencrypted fallback. Supabase's managed
# daily backups are the first line; this is the hourly copy off Supabase, since
# exhibition days write real money orders all day. The export is tiny, so 24
# artifacts/day is negligible.
#
# Repo secrets required: PORTAL_URL, CRON_SECRET (same as sync-cron.yml), and
# BACKUP_PASSPHRASE. The artifact is encrypted (gpg, AES-256) with the
# passphrase and can only be read with it. If BACKUP_PASSPHRASE is missing the
# run stores NO artifact: it logs an error annotation and ends green (so it
# does not email a failure every hour). Add the secret to resume backups.
# Decrypt: gpg --batch --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" -d backup.json.gz.gpg > backup.json.gz
name: daily-backup

on:
  schedule:
    - cron: "17 * * * *" # hourly at :17
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Download backup
        run: |
          set -e
          code=$(curl -s -o backup.json.gz -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/cron/backup")
          echo "HTTP $code"
          [ "$code" = "200" ]
          gunzip -t backup.json.gz
          ls -la backup.json.gz
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -e
          if [ -n "$BACKUP_PASSPHRASE" ]; then
            gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_PASSPHRASE" -o backup.json.gz.gpg backup.json.gz
            rm backup.json.gz
            echo "ARTIFACT=backup.json.gz.gpg" >> "$GITHUB_ENV"
          else
            # Never upload an unencrypted export. End green (no hourly failure
            # emails) but leave a visible error on the run.
            rm -f backup.json.gz
            echo "::error title=No backup stored::BACKUP_PASSPHRASE is not set, so no backup artifact was stored this run. Add the BACKUP_PASSPHRASE repo secret to resume hourly backups (Supabase's managed daily backups still run)."
          fi
      - name: Store artifact
        if: ${{ env.ARTIFACT == 'backup.json.gz.gpg' }}
        uses: actions/upload-artifact@v6
        with:
          name: drevi-backup-${{ github.run_number }}
          path: ${{ env.ARTIFACT }}
          retention-days: 90
