# BACKSTOP for the product sync and the SKU registry sync. The 10-minute
# cadence runs on Vercel Cron (vercel.json; the Vercel team is on Pro, which
# runs crons on the minute). GitHub runs this "*/10" schedule only every 5-8
# hours in practice (19-20 Nov 2026: 00:36, 07:52, 16:56, 23:22, 04:06,
# 12:45 UTC), so it cannot be the main clock. It stays as a second caller in
# case a Vercel cron run is missed; an extra run is harmless.
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   PORTAL_URL   e.g. https://wholesale.drevifashion.com
#   CRON_SECRET  same value as the Vercel env var
name: sync-products

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          set -e
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/cron/sync-products")
          echo "HTTP $code"
          cat /tmp/out.json
          [ "$code" = "200" ]
      - name: Sync SKU registry (importer + mirror retry)
        run: |
          set -e
          code=$(curl -s -o /tmp/sku.json -w "%{http_code}" --max-time 120 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/cron/sync-sku-registry")
          echo "HTTP $code"
          cat /tmp/sku.json
          [ "$code" = "200" ]
      # The database calls this every 5 minutes (migration 0113). This call is a
      # backstop: GitHub runs this schedule only every few hours in practice.
      - name: Appointment messages (sends only when switched on in the portal)
        if: always()
        run: |
          code=$(curl -s -o /tmp/appt.json -w "%{http_code}" --max-time 70 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/cron/appointments")
          echo "HTTP $code"
          cat /tmp/appt.json
          [ "$code" = "200" ] || [ "$code" = "404" ]
